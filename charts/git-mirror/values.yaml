image:
  repository: git-mirror
  tag: "0.1.0"
  pullPolicy: IfNotPresent

source:
  url: ""
  username: x-access-token
  token: ""

repoName: repo
syncIntervalSeconds: 30
maxSyncAgeSeconds: 600
maxConnections: 64

persistence:
  size: 20Gi
  storageClass: ""

service:
  type: ClusterIP
  port: 9418
  nodePort: null

resources:
  sync:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 4Gi
  daemon:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      memory: 2Gi
