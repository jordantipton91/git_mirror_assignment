{{- if .Values.source.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "git-mirror.fullname" . }}
  labels:
    {{- include "git-mirror.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.source.username | quote }}
  token: {{ .Values.source.token | quote }}
{{- end }}
